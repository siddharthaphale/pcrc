# Small CPU integration check; not a paper-budget experiment.
defaults:
  env_id: MiniGrid-DoorKey-8x8-v0
  n_train: 4
  n_held: 2
  bank_seed: 0
loop:
  n_iterations: 2
  episodes_per_iter: 2
  max_steps: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 1
  minibatch: 32
  lr: 0.00025
  ent_coef: 0.01
  encoder: cnn
  eval_interval: 1
  n_eval_episodes: 2
  seed: 0
scaffold:
  n_levels: 5
  level_fractions:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  anneal_iters: 1500
  stale_advance_windows: 4
