# PointMaze Large — LONG-HORIZON stress test (Experiment Campaign 4, Stage B — continuous-control arm).
#
# Second long-horizon environment for guardrail #2, in a DIFFERENT modality than DoorKey-16x16
# (continuous-control SAC+HER vs discrete PPO). Identical maze (PointMaze_Large-v3, 9x12) and FROZEN
# controller as the Stage-0 PointMaze run; the ONLY change is a longer geodesic distance band —
# start->goal band [14,18] (mean ~15.7 cells) vs the Stage-0 band [9,13] (mean ~11), i.e. ~1.4x horizon
# (the built-in Large maze caps at geodesic distance 19, so this is the longest band it supports without
# a custom map). max_steps_per_episode raised 300 -> 500 so the longer paths are completable within budget
# (env horizon, NOT a controller knob — the direct analog of DoorKey-16x16's max_steps bump). Bank +
# trajectory ladder: pointmaze_longhorizon_geodesic.json (sha a8a03a38) / pointmaze_lh_s0.json (sha 7d7645e4).
# Access comparison (B-PM.1): uniform / global_anneal / per_context_success / trajectory_per_context_success, seeds 40-42.
# Eval always at ell=0 (true start). Controller kwargs below are BYTE-IDENTICAL to pointmaze_curriculum.yaml.

defaults:
  env_id: PointMaze_Large-v3
  n_train: 100
  n_held: 50
  bank_seed: 0

loop:
  n_iterations: 4000
  max_steps_per_episode: 500
  her_strategy: future
  her_n_sampled_goal: 4
  replay_capacity: 300000
  minibatch_size: 256
  learning_starts: 1000
  updates_per_iter: 16
  eval_interval: 100
  n_eval_episodes_per_context: 2
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  success_distance_threshold: 0.45
  reward_distance_threshold: 0.45
  success_ema_alpha: 0.2
  random_eps: 0.1
  noise_eps: 0.1
  num_workers: 6

sac:
  hidden_sizes: [256, 256]
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  target_entropy: null
  init_log_alpha: -1.6
  action_low: -1.0
  action_high: 1.0

# Shared across all scaffold conditions. mode is set per-condition by the driver.
scaffold:
  n_levels: 5
  level_fractions: [0.0, 0.25, 0.5, 0.75, 0.9]
  oracle_direct_level: 4
  oracle_bypass_level: 0
  kwargs:
    lambda_h: 1.0
    lambda_u: 1.0
    lambda_p: 0.2
    lambda_stale: 0.1
    tau: 0.5
    epsilon: 0.1
    beta_s: 0.2
    beta_u: 0.2
    tau_lo: 0.15
    tau_hi: 0.8
    u_lo: -0.25
    u_hi: 0.5
    n_min: 15
    cooldown: 3
    hysteresis_windows: 2
    stale_advance_windows: 4
    clip: 3.0
    anneal_iters: 1500   # global_anneal baseline schedule (levels L->0); unchanged from Stage 0

reverse_curriculum:
  reverse_curriculum: true
  reverse_curriculum_start_progress: 0.9
  reverse_curriculum_decay_iters: 1500

sampler_kwargs:
  uniform: {}
