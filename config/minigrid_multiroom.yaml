# MiniGrid MultiRoom-N4-S5 — PCRC discrete-PPO natural-task run (docs/pcrc_new_tasks/EXECUTION_PLAN.md D).
# Discrete long-horizon navigation through a sequence of rooms (partial 7x7 observation). Scaffold = route
# progress (start the agent at progressively later rooms; stage 4 = next to the goal). Evaluation always on
# held-out layouts at level 0. Reuses scripts/minigrid_ppo.py (env-agnostic driver).

defaults:
  env_id: MiniGrid-MultiRoom-N4-S5-v0
  n_train: 200
  n_held: 100
  bank_seed: 0

loop:
  n_iterations: 2000
  episodes_per_iter: 16
  max_steps: 200
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 4
  minibatch: 1024
  lr: 2.5e-4
  ent_coef: 0.01
  encoder: cnn
  eval_interval: 50
  n_eval_episodes: 50
  seed: 0

scaffold:
  n_levels: 5
  level_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
  anneal_iters: 1500
  stale_advance_windows: 4
