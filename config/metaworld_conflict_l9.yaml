# L9 ladder-resolution variant of metaworld_conflict.yaml (dilution attack on the async
# global mixture): 9 levels, fractions linear 0->0.9. Population-level mixing spreads its
# intermediate mass over 7 levels (~half the per-level exposure of L5) while per-context
# frontiers still concentrate at one cell; run at 9000 it so the longer per-context chain
# (8 transitions x ~min-evidence window) completes. All conditions share the ladder (fair).
defaults:
  env_id: metaworld:push-v3+pick-place-v3:handnear:graspcur
  tasks:
  - push-v3
  - pick-place-v3
  n_train: 100
  n_held: 50
  bank_seed: 0
loop:
  n_iterations: 4000
  max_steps_per_episode: 150
  her_strategy: future
  her_n_sampled_goal: 4
  replay_capacity: 600000
  minibatch_size: 256
  learning_starts: 1000
  updates_per_iter: 16
  eval_interval: 150
  n_eval_episodes_per_context: 2
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  success_distance_threshold: 0.05
  reward_distance_threshold: 0.05
  success_ema_alpha: 0.2
  random_eps: 0.3
  noise_eps: 0.2
  num_workers: 8
sac:
  hidden_sizes:
  - 256
  - 256
  learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  target_entropy: null
  init_log_alpha: -1.6
  action_low: -1.0
  action_high: 1.0
scaffold:
  n_levels: 9
  level_fractions:
  - 0.0
  - 0.1125
  - 0.225
  - 0.3375
  - 0.45
  - 0.5625
  - 0.675
  - 0.7875
  - 0.9
  oracle_dist_threshold: 0.18
  oracle_low_level: 0
  oracle_high_level: 4
  kwargs:
    lambda_h: 1.0
    lambda_u: 1.0
    lambda_p: 0.2
    lambda_stale: 0.1
    tau: 0.5
    epsilon: 0.1
    beta_s: 0.2
    beta_u: 0.2
    tau_lo: 0.15
    tau_hi: 0.8
    u_lo: -0.25
    u_hi: 0.5
    n_min: 15
    cooldown: 3
    hysteresis_windows: 2
    stale_advance_windows: 4
    clip: 3.0
    anneal_iters: 3000
reverse_curriculum:
  reverse_curriculum: true
  reverse_curriculum_start_progress: 0.9
  reverse_curriculum_decay_iters: 3000
sampler_kwargs:
  uniform: {}
