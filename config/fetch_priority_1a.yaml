# Pre-VLA Priority 1a — Fetch task-bank calibration config.
#
# Consumed by:
#   - scripts/priority_1a_fetch_calibration.py
#   - tests/cpu/envs/* (load this file to avoid hardcoding env IDs)
#
# Plan reference: docs/actor_curator_gymrobotics_implementation_plan.md
#   §3.2  FetchTaskBank
#   §3.3  FetchTaskEnvironment
#   §10   Stage A1 audit (2/3) — env IDs resolved at audit time
#   §9    risk #1 — shared starter checkpoint
#
# Stage A1 audit (2/3) resolution. Enumeration on this repo returned v4
# across every Fetch family in gymnasium-robotics 1.4.2 + gymnasium 1.3.0
# + mujoco 3.9.0. The plan's "prefer latest registered version per family"
# rule selects v4. The v1 ids are also still registered for backwards
# compatibility but are not used here.
#
# No module under src/pcrc/ may hardcode a Fetch*-v3 / Fetch*-v4 literal.
# Every env id lookup goes through this YAML.

env_ids:
  reach_dense: FetchReachDense-v4
  push_dense: FetchPushDense-v4
  push_sparse: FetchPush-v4
  pick_and_place_dense: FetchPickAndPlaceDense-v4
  pick_and_place_sparse: FetchPickAndPlace-v4
  slide_dense: FetchSlideDense-v4
  slide_sparse: FetchSlide-v4

# Default env for Priority 1a calibration. Reach is the cheapest env on
# which to validate the bank + wrapper + calibration loop; Priorities
# 1c / 2 / 3 override this to push_dense / push_sparse via their own
# config files (config/fetch_priority_1c.yaml etc.).
default_env: reach_dense

# ---------------------------------------------------------------------------
# Bank construction
# ---------------------------------------------------------------------------
# Plan §3.2: 100–1000 contexts in the pre-VLA setting. Priority 1a starts
# small so calibration wall-time stays modest; Priority 2 scales up the
# train bank to 500–800 via its own config.
bank:
  num_train_contexts: 100
  num_held_out_contexts: 50
  seed: 20260605  # YYYYMMDD of bank construction; bump on any redesign.
  # Bin counts target balanced stratification across distance / direction
  # / pose strata. The actual per-bin starter success is the calibration
  # output (Priority 1a hard gate); the targets here are the design
  # *guideline*, not a hard gate (§4.0 Priority 1a soft outcome row).
  distance_bins: 5
  direction_bins: 5
  pose_bins: 4  # Push / PickAndPlace only; Reach ignores this bin.

# ---------------------------------------------------------------------------
# Shared starter checkpoint — §9 risk #1
# ---------------------------------------------------------------------------
# Short uniform PPO warmup whose checkpoint is consumed by every Stage D
# condition. NOT counted in the curriculum-vs-uniform budget. One shared
# starter per env_id; downstream priorities pin its path in their configs.
starter:
  warmup_env_steps: 15000  # plan-range 10k–25k; midpoint
  # Filename pattern under <CHECKPOINTS_ROOT>/. Loop substitutes {env_id}.
  checkpoint_filename: fetch_starter_{env_id}.pt
  # PPO knobs for the warmup. Kept inline (small enough) rather than
  # pulled from a separate ppo_continuous.yaml — Stage A2 modules
  # generalize this once they exist.
  ppo:
    learning_rate: 3.0e-4
    n_steps_per_update: 2048
    n_epochs: 10
    minibatch_size: 64
    clip_eps: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.0
    value_coef: 0.5
    max_grad_norm: 0.5
    hidden_sizes: [64, 64]

# ---------------------------------------------------------------------------
# Calibration runner
# ---------------------------------------------------------------------------
calibration:
  episodes_per_context: 8  # success rate resolution: 1/8 = 0.125
  max_steps_per_episode: 50  # gymnasium-robotics Fetch default horizon
  # Bin assignment falls back to dense-return / final-goal-distance
  # buckets if binary success is too sparse after warmup. The fallback
  # threshold is "binary success rate variance across the train bank
  # below 0.01" — see fetch_calibration.py docstring.
  dense_fallback_variance_threshold: 0.01
  # Design guideline (NOT a hard gate per §4.0): per-bin starter success
  # in [0.05, 0.70] avoids dead + saturated contexts dominating.
  target_success_band: [0.05, 0.70]
