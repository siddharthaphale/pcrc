# PCRC Nav-bypass (Gate D / breadth, sharpened) — PointMaze off-path scaffold conflict.
#
# Sharper no-compromise variant of pointmaze_curriculum.yaml: the scaffold LEVEL FRACTIONS skip the
# low/mid range ([0, 0.7, 0.8, 0.9, 0.95]) so the only non-zero levels are high-alpha, which the
# off-path geometry BYPASSES for the (sharp-selected) bypass group → no scaffold level is a workable
# compromise. bypass learnable only at L0 (true start); direct needs high scaffold. Use with
# --bank-path results/pointmaze_strata_sharp_calibration/... and --scaffold-geometry offpath.

defaults:
  env_id: PointMaze_Large-v3
  n_train: 100
  n_held: 50
  bank_seed: 0
  scaffold_geometry: offpath

loop:
  n_iterations: 4000
  max_steps_per_episode: 300
  her_strategy: future
  her_n_sampled_goal: 4
  replay_capacity: 300000
  minibatch_size: 256
  learning_starts: 1000
  updates_per_iter: 16
  eval_interval: 200
  n_eval_episodes_per_context: 2
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  success_distance_threshold: 0.45
  reward_distance_threshold: 0.45
  success_ema_alpha: 0.2
  random_eps: 0.1
  noise_eps: 0.1
  num_workers: 6

sac:
  hidden_sizes: [256, 256]
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  target_entropy: null
  init_log_alpha: -1.6
  action_low: -1.0
  action_high: 1.0

scaffold:
  n_levels: 5
  # High-only fractions: no low/mid compromise level (off-path bypasses all of these for bypass).
  level_fractions: [0.0, 0.7, 0.8, 0.9, 0.95]
  oracle_direct_level: 4   # direct -> high scaffold (alpha 0.95, on-route bootstrap)
  oracle_bypass_level: 0   # bypass -> true start (any scaffold bypasses its bottleneck)
  kwargs:
    lambda_h: 1.0
    lambda_u: 1.0
    lambda_p: 0.2
    lambda_stale: 0.1
    tau: 0.5
    epsilon: 0.1
    beta_s: 0.2
    beta_u: 0.2
    tau_lo: 0.15
    tau_hi: 0.8
    u_lo: -0.25
    u_hi: 0.5
    n_min: 15
    cooldown: 3
    hysteresis_windows: 2
    stale_advance_windows: 4
    clip: 3.0
    anneal_iters: 2500   # global_anneal schedule over the 4000-iter budget

reverse_curriculum:
  reverse_curriculum: true
  reverse_curriculum_start_progress: 0.95
  reverse_curriculum_decay_iters: 2500

sampler_kwargs:
  uniform: {}
