# MiniGrid DoorKey-16x16 — PCRC discrete-PPO LONG-HORIZON stress test (Experiment Campaign 4, Stage B).
# Same key -> locked door -> goal 3-stage structure as DoorKey-8x8, but ~2.3x the solution length
# (median 37 vs 16 steps) and a much longer navigation horizon. Tests whether PCRC + the trajectory
# scaffold extend to longer horizon (B.1 access) and whether the scaffold level count must grow with
# horizon (B.2 sweep: 5 vs 9 vs 13 levels). Evaluation always on held-out layouts at level 0.
# trajectory_ conditions derive n_levels/level_fractions from the loaded ladder (scripts/minigrid_ppo.py), so
# the level-count sweep only needs different --ladder-path artifacts; this scaffold block is the default.

defaults:
  env_id: MiniGrid-DoorKey-16x16-v0
  n_train: 100
  n_held: 50
  bank_seed: 0

loop:
  n_iterations: 3000
  episodes_per_iter: 16
  max_steps: 320
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 4
  minibatch: 1024
  lr: 2.5e-4
  ent_coef: 0.01
  encoder: cnn
  eval_interval: 50
  n_eval_episodes: 50
  seed: 0

scaffold:
  n_levels: 5
  level_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
  anneal_iters: 2250
  stale_advance_windows: 4
