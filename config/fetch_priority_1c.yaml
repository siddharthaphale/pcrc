# Pre-VLA Priority 1c — Dense PPO main mechanism test on FetchPushDense-v4.
#
# Plan reference: docs/actor_curator_gymrobotics_implementation_plan.md
#   §4 Priority 1c (dense PPO push)
#   §8 (RunLogger streams)
#
# Push is harder than Reach — longer horizon, dense reward shape
# different. Hyperparameters bump n_iterations and update budget;
# everything else mirrors 1b.

defaults:
  bank_path: results/priority_1a_push_calibration/calibration/bank.json
  env_id: FetchPushDense-v4

loop:
  n_iterations: 100
  episodes_per_iteration: 16
  max_steps_per_episode: 50
  eval_interval: 10
  n_eval_episodes_per_context: 4
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  utility_clip_eps: 0.2
  utility_center: true
  # Normalize the per-context utility (divide by std) per plan §Priority 1b
  # ("center AND normalize before the OSMD update"). Standardized utilities
  # decouple the OSMD learning rate from raw utility magnitude so a moderate
  # eta gives gradual concentration instead of slamming to the q_max cap.
  utility_scale: true
  success_distance_threshold: 0.05
  success_ema_alpha: 0.2

ppo:
  hidden_sizes: [128, 128]
  learning_rate: 3.0e-4
  clip_eps: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 10
  minibatch_size: 128
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  log_std_init: -0.5

sampler_kwargs:
  uniform: {}
  reward_greedy:
    alpha: 5.0
    ema_alpha: 0.1
  headroom:
    alpha: 20.0
    ema_alpha: 0.1
  learning_progress:
    alpha: 10.0
    fast_ema_alpha: 0.3
    slow_ema_alpha: 0.05
  tabular_actor_curator:
    # Moderate OSMD step on standardized utilities — gradual curriculum
    # rather than instant cap-pinning (eta=1.0 hit the q_max cap by ~iter 12).
    eta: 0.3
  mlp_actor_curator:
    alpha: 1.0
    learning_rate: 1.0e-3
    clip_eps: 0.2
    n_epochs: 4
    hidden_sizes: [64, 64]
    dropout: 0.0
    weight_decay: 0.0
    feature_noise: 0.0
    feature_perturbation: none
