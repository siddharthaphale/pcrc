# Meta-World push-v3 + demos+BC + STABILIZATION — GATE-1b retry.
#
# First demos+BC run unlocked push-v3 off zero (peaks 0.12 uniform / 0.28 headroom) but training
# DESTABILIZED: alpha->0 (exploration dies) and the critic diverged (q1 +1.6 -> -15) once
# self-generated failures diluted the demos in the shared 400k replay -> success collapsed to ~0.
# Two faithful-to-Nair-2018 fixes (see docs/gymrobotics_results/metaworld_push_gate1_results.md):
#   * demo_replay_fraction: protected demo buffer (demos kept OUT of the main replay, never
#     evicted; this fraction of every minibatch drawn from it -> critic keeps seeing successes).
#   * alpha_min: floor the SAC entropy temperature so exploration never fully dies.
# GATE 1b (retry): does held-out mean(last-5) climb > ~0.2 STABLY? PASS -> curriculum screen.
# Plan: docs/metaworld_generalization_plan.md.

defaults:
  env_id: metaworld:push-v3
  n_train: 100
  n_held: 50
  bank_seed: 0

loop:
  n_iterations: 2000          # learnability smoke; budget ~ 2000*8*150 env-steps
  max_steps_per_episode: 150  # Meta-World defaults to 500; cap for HER + throughput
  her_strategy: future
  her_n_sampled_goal: 4
  replay_capacity: 400000
  minibatch_size: 256
  learning_starts: 1000
  updates_per_iter: 16
  eval_interval: 100
  n_eval_episodes_per_context: 2
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  success_distance_threshold: 0.05
  reward_distance_threshold: 0.05
  success_ema_alpha: 0.2
  # HER-paper action exploration (helps seed contacts).
  random_eps: 0.3
  noise_eps: 0.2
  num_workers: 8
  diagnostic_compute_utility: true   # Phase 1.5: within-band diagnostic from the uniform run
  # demos + behavior-cloning (Nair 2018) — the learnability unlock for the reach-then-push wall.
  demos_path: results/mw_demos/push_demos.npz
  bc_lambda: 0.1
  use_q_filter: true
  bc_minibatch_size: 128
  demo_replay_fraction: 0.25   # protected demo buffer: 25% of each minibatch from never-evicted demos

sac:
  hidden_sizes: [256, 256]
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  target_entropy: null
  init_log_alpha: -1.6
  alpha_min: 0.05              # floor entropy temperature so exploration never fully dies
  action_low: -1.0
  action_high: 1.0

sampler_kwargs:
  uniform: {}
  headroom:
    alpha: 20.0
    ema_alpha: 0.1
  uncertainty:
    alpha: 3.0
    ema_alpha: 0.2
