# AntMaze-Large — long-horizon continuous LOCOMOTION+navigation (Experiment Campaign 4, Stage B — AntMaze arm).
#
# Canonical long-horizon sparse-reward benchmark (D4RL/gymnasium-robotics), a CROSS-MODALITY long-horizon
# test beyond DoorKey-16x16: the 8-DOF ant must learn to WALK and navigate, so the horizon (in env-steps) is
# long even on the same 9x12 maze as PointMaze-Large. Goal-conditioned (obs 27 / achieved,desired 2 / act 8),
# sparse 0/-1 reward at success radius 0.45 world-units in 4-unit cells (a tight goal -> genuinely hard).
#
# Manual geodesic scaffold works with NO new codec/reference: reset_cell places the ant in a valid standing
# pose at a cell a fraction alpha along the shortest path (PointMazeTaskEnvironment handles AntMaze via the
# env_id dispatch). Trajectory-derived/self scaffolds (Phase 2) need AntMazeStateCodec + a reference policy.
# Controller FROZEN (identical kwargs to pointmaze_curriculum.yaml). Eval always at ell=0 (true start).

defaults:
  env_id: AntMaze_Large-v5
  n_train: 100
  n_held: 50
  bank_seed: 0

loop:
  n_iterations: 1500          # FEASIBILITY-GATE budget; raise for the full run if the ant learns
  max_steps_per_episode: 700  # ant walks slowly; 700 covers a few cells
  her_strategy: future
  her_n_sampled_goal: 4
  replay_capacity: 500000
  minibatch_size: 256
  learning_starts: 2000
  updates_per_iter: 16
  eval_interval: 50
  n_eval_episodes_per_context: 2
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  success_distance_threshold: 0.45   # AntMaze info['success'] radius (gymnasium-robotics ant_maze_v5)
  reward_distance_threshold: 0.45    # == success radius, so HER relabel reward matches the env
  success_ema_alpha: 0.2
  random_eps: 0.1
  noise_eps: 0.1
  num_workers: 6

sac:
  hidden_sizes: [256, 256]
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  target_entropy: null
  init_log_alpha: -1.6
  action_low: -1.0
  action_high: 1.0

scaffold:
  n_levels: 5
  level_fractions: [0.0, 0.25, 0.5, 0.75, 0.9]
  oracle_direct_level: 4
  oracle_bypass_level: 0
  kwargs:
    lambda_h: 1.0
    lambda_u: 1.0
    lambda_p: 0.2
    lambda_stale: 0.1
    tau: 0.5
    epsilon: 0.1
    beta_s: 0.2
    beta_u: 0.2
    tau_lo: 0.15
    tau_hi: 0.8
    u_lo: -0.25
    u_hi: 0.5
    n_min: 15
    cooldown: 3
    hysteresis_windows: 2
    stale_advance_windows: 4
    clip: 3.0
    anneal_iters: 1000

reverse_curriculum:
  reverse_curriculum: true
  reverse_curriculum_start_progress: 0.9
  reverse_curriculum_decay_iters: 1000

sampler_kwargs:
  uniform: {}
