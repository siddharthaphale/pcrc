# Pre-VLA Priority 3 — Sparse Fetch + SAC + HER.
#
# Plan reference: docs/actor_curator_gymrobotics_implementation_plan.md
#   §4 Priority 3 (sparse driver, tagged global replay default,
#                  HER on by default, critic-improvement AC utility)
#   §9 risk #4 (replay memory budget), §9 risk #5 (HER + sampler)
#
# Default sparse env: FetchPush-v4. FetchPickAndPlace-v4 is the
# fallback if AC ≈ Uniform on Push (plan Priority 3 decision table).
#
# Bank: separate sparse calibration via priority_1a with --env push_sparse.
# Point ``defaults.bank_path`` at that calibrated bank.

defaults:
  bank_path: results/priority_3_sparse_calibration/calibration/bank.json
  env_id: FetchPush-v4

loop:
  n_iterations: 3000
  max_steps_per_episode: 50
  her_strategy: future
  her_n_sampled_goal: 4
  replay_capacity: 200000
  minibatch_size: 256
  learning_starts: 1000
  updates_per_iter: 16
  eval_interval: 300
  n_eval_episodes_per_context: 2
  seed: 42
  epsilon: 0.05
  q_max: 0.5
  success_distance_threshold: 0.05
  success_ema_alpha: 0.2
  # HER-paper action exploration (Andrychowicz et al. 2017 FetchPush).
  random_eps: 0.3
  noise_eps: 0.2
  # CPU parallel rollout workers (spawned processes). Measured ~3.7x
  # env-step throughput at 8 workers (IPC + main-process serial HER/replay
  # cap it below N x). For a single high-budget run bump toward cores-2;
  # for a parallel-conditions sweep keep num_workers x n_conditions <= cores.
  num_workers: 8

sac:
  hidden_sizes: [256, 256]
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  target_entropy: null  # default -action_dim
  init_log_alpha: -1.6  # ≈ log(0.2)
  action_low: -1.0
  action_high: 1.0

sampler_kwargs:
  uniform: {}
  reward_greedy:
    alpha: 5.0
    ema_alpha: 0.1
  headroom:
    alpha: 20.0
    ema_alpha: 0.1
  learning_progress:
    alpha: 10.0
    fast_ema_alpha: 0.3
    slow_ema_alpha: 0.05
  tabular_actor_curator:
    eta: 0.3
  mlp_actor_curator:
    alpha: 1.0
    learning_rate: 1.0e-3
    clip_eps: 0.2
    n_epochs: 4
    hidden_sizes: [64, 64]
    dropout: 0.0
    weight_decay: 0.0
    feature_noise: 0.0
    feature_perturbation: none
